{% for meeting in meetings %}
  <div class="card {% if company.is_old %}old{% endif %}">
    <span class="title" title="{{meeting.subject}}">
      <a href="/meetings/{{meeting.id}}/">{{meeting.subject}}</a>
    </span>
    <hr>
    <span>CG: — </span>
    <span>Гости: — </span>
    <hr>
    <span class="date" >{{ meeting.meeting_date|date:"d-m-Y" }}</span>
  </div>
{% endfor %}
