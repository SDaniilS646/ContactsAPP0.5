{% load tags %}

<div class="tree-node">
  <div class="tree-title">
    {% material_node_tag style material parent %}
  </div>

  {% if material.children %}
    <div class="tree-children">
      {% for child in material.children %}
        {% include 'components/material_tree.html' with material=child %}
      {% endfor %}
    </div>
  {% endif %}
</div>
