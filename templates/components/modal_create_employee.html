<div id="create_employee_modal_frame" class="modal" style="z-index: 2">
  <div class="modal-content">
    <div class="header">
      {% include 'components/modal_close_btn.html' with frame_id='create_employee_modal_frame' %}
      <h3>Создать сотрудника</h3>
    </div>

    <div class="main-frame">
      <div id="employee-creation">
        {% csrf_token %}
        <div class="form-item">
          <label for="last_name" name="last_name_label">Фамилия</label>
          <input type="text" name="last_name">
        </div>
        <div class="form-item">
          <label for="first_name" name="first_name_label">Имя</label>
          <input type="text" name="first_name">
        </div>
        <div class="form-item">
          <label for="patronymic">Отчество</label>
          <input type="text" name="patronymic">
        </div>
        <div class="form-item">
          <label for="phone">Доб.телефон</label>
          <input type="text" name="phone" placeholder="1298">
        </div>
        <div class="form-item">
          <label for="mail">Почта</label>
          <input type="email" name="mail" placeholder="savkov.ds@capitalgroup.ru">
        </div>
      </div>
    </div>

    <div class="footer">
      <button onclick="post_employee_create(); selectedEmployees = []">Сохранить сотрудника</button>
    </div>
  </div>
</div>
