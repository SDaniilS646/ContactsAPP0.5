<div id="create_object_modal_frame" class="modal" style="z-index: 2">
  <div class="modal-content">
    <div class="header">
      {% include 'components/modal_remove_btn.html' with frame_id='create_object_modal_frame' %}
      <h3>Создать объект</h3>
    </div>

    <div class="main-frame">
      <div id="object-creation">
        <div class="form-item">
          <label for="object_name" name="object_name_label">Наименование объекта</label>
          <input type="text" name="object_name">
        </div>
      </div>
    </div>
    <div class="footer">
      <button onclick="post_object_create();">Сохранить объект</button>
    </div>
  </div>
</div>
