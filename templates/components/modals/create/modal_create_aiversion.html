<div id="create_aimodel_modal_frame" class="modal" style="z-index: 2">
  <div class="modal-content">
    <div class="header">
      {% include 'components/modal_remove_btn.html' with frame_id='create_aimodel_modal_frame' %}
      <h3>Создать версию</h3>
    </div>

    <div class="main-frame">
      <div id="aiversion-creation">
        <div class="form-item">
          <label for="model_name" name="model_name_label">Модель:</label>
          <input type="text" name="model_name" value="{{model.model_name}}" disabled>
        </div>
        <div class="form-item">
          <label for="temperature" name="temperature_label">Temperature:</label>
          <input type="text" name="temperature" value="{{model.temperature}}">
        </div>
        <div class="form-item">
          <label for="max_tokens" name="max_tokens_label">Лимит токенов:</label>
          <input type="text" name="max_tokens" value="{{model.max_tokens}}">
        </div>
        <div class="form-item">
          <label for="system_prompt" name="temperature_label">Промпт:</label>
          <textarea type="text" name="system_prompt">{{model.system_prompt}}</textarea>
        </div>
        <div class="form-item">
          <label for="notes" name="notes_label">Заметки:</label>
          <textarea type="text" name="notes">{{model.notes}}</textarea>
        </div>
      </div>
    </div>
    <div class="footer">
      <button onclick="post_create_model_version({{model.task_id}})">Сохранить версию</button>
    </div>
  </div>
</div>
