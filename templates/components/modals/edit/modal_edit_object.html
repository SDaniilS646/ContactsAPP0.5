<div id="edit_object_modal_frame" class="modal create" style="z-index:2;">
  <div class="modal-content">
    <div class="header">
      {% include 'components/modal_remove_btn.html' with frame_id='edit_object_modal_frame' %}
    </div>

    <div class="main-frame">
      <div id="object-creation">
        <div class="form-item">
          <label for="object_name" name="object_name_label">Наименование объекта</label>
          <input type="text" name="object_name" value="{{object.name}}">
        </div>
      </div>
    </div>

    <div class="footer">
      <button onclick="post_object_edit({{object.id}});">Сохранить объект</button>
    </div>
  </div>
</div>
