<div id="edit_employee_modal_frame" class="modal create" style="z-index:2;">
  <div class="modal-content">
    <div class="header">
      {% include 'components/modal_close_btn.html' with frame_id='edit_employee_modal_frame' %}
      <h3>Редактировать сотрудника</h3>
    </div>

    <div class="main-frame">
      <hr>
      <div id="employee-edit">
        {% csrf_token %}
        <input type="hidden" name="id" value={{employee.id}}>
        
        <div class="form-item">
          <label for="last_name" name="last_name_label">Фамилия</label>
          <input type="text" name="last_name" {% if employee.last_name %}value="{{employee.last_name}}"{% endif %}>
        </div>
        <div class="form-item">
          <label for="first_name" name="first_name_label">Имя</label>
          <input type="text" name="first_name" {% if employee.first_name %}value="{{employee.first_name}}"{% endif %}>
        </div>
        <div class="form-item">
          <label for="patronymic">Отчество</label>
          <input type="text" name="patronymic" {% if employee.patronymic %}value="{{employee.patronymic}}"{% endif %}>
        </div>
        <div class="form-item">
          <label for="phone">Моб.телефон</label>
          <input type="text" name="phone" {% if employee.phone %}value="{{employee.phone}}"{% endif %} placeholder="1298">
        </div>
        <div class="form-item">
          <label for="mail">Почта</label>
          <input type="email" name="mail" {% if employee.mail %}value="{{employee.mail}}"{% endif %} placeholder="savkov.ds@capitalgroup.ru">
        </div>
      </div>
    </div>

    <div class="footer">
      <button onclick="post_employee_edit()">Сохранить изменения</button>
    </div>

 </div>
</div>
