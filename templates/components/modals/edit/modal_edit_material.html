<div id="edit_material_modal_frame" class="modal create" style="z-index:2;">
  <div class="modal-content">
    <div class="header">
      {% include 'components/modal_close_btn.html' with frame_id='edit_material_modal_frame' %}
      <h3>Редактиврать материал</h3>
    </div>

    <div class="main-frame">
      <hr>
      <div id="material-creation">
        <div id="creation_material_tree" class="tree">
          {% include 'lists/materials_list.html' with style='material_editor' %}
        </div>
        <input type="hidden" name="parent_id" value="{{parent.id}}">
        <input type="hidden" name="id" value="{{material.id}}">

        <div class="inputs">
          <label for="material_name" name="material_name_label" >Наименование</label>
          <div class="form-item material-and-measure">
            
            <input type="text" name="material_name" value="{{material.name}}">
            <select name="measureList" id="measure-select">
              {% for measure in measures %}
                <option value="{{measure.id}}" title="{{measure.title}}" {% if material.measure.id == measure.id %}selected{% endif %}>{{measure.name}}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-item">
            <label for="keywords">Ключевые слова</label>
            <textarea type="text" name="keywords" placeholder="гкл,гвл,гклв">{{material.keywords}}</textarea>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <button onclick="post_material_edit({{all_children}})">Сохранить материал</button>
    </div>
  </div>
</div>
