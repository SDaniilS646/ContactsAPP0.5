<div id="list_measure_modal_frame" class="modal" style="z-index:2;">
  <div class="modal-content">
    <div class="header">
      {% include 'components/modal_remove_btn.html' with frame_id='list_measure_modal_frame' %}
      {% comment %} <h3>Создать единицу измерения</h3> {% endcomment %}
    </div>

    <div class="main-frame">
      <hr>
      <div id="measure-list">
        {% for measure in measures %}
          <div>
            <button class="spec-btn" onclick="openModal('edit_measure_modal_frame', 'editMeasure', {{measure.id}});">edit</button>
            <button class="spec-btn" onclick="post_delItem('measures', {{measure.id}})">X</button>
            <span>{{measure.name}}</span>
            {% if measure.title %}<span> — {{measure.title}}</span> {% endif %}
          </div>
        {% endfor %}
      </div>
    </div>

    <div class="footer">
      <button onclick="openModal('create_measure_modal_frame', 'createMeasure');">Создать единицу измерения</button>
    </div>
  </div>
</div>
