<div id="choose_employee_modal_frame" class="modal" style="z-index: 1">
  <div class="modal-content">
    <div class="header">
      {% include 'components/modal_close_btn.html' with frame_id='choose_employee_modal_frame' %}
      <h3>Сотрудники</h3>
    </div>
    
    <div class="main-frame">
      <input id="employees-list-on-create" type="text" name="search" value="{{search}}" placeholder="Поиск.." />
      <hr>
      <div id="employees-list" class="employees-list comp_creation">
        {% include 'lists/employees_list.html' with style='comp_creation' %}
      </div>
    </div>
    <hr>
    <div class="footer">
      {% if is_edit %}
        <button onclick="saveContactsList(); post_ContactsList({{company.id}})">Сохранить изменения</button>
      {% else %}
        <button onclick="saveEmployeesList()">Сохранить</button>
      {% endif %}
      <button onclick="openModal('create_employee_modal_frame', 'createEmployee')">Создать новый</button>
    </div>
  </div>
</div>
