<div id="choose_material_modal_frame" class="modal">
  <div class="modal-content">
    <div class="header">
      {% include 'components/modal_close_btn.html' with frame_id='choose_material_modal_frame' %}
      <h3>Материалы</h3>
    </div>
    
    <div class="main-frame">
      <hr>
      <div id="list_material_tree" class="tree company_creation">
        {% include 'lists/materials_list.html' with style='company_creation' %}
      </div>
    </div>

    <div class="footer">
      {% if company_id %}
        <button onclick="saveMaterialsList(); post_MaterialsList({{company_id}})">Сохранить изменения</button>
      {% else %}
        <button onclick="saveMaterialsList()">Сохранить</button>
      {% endif %}
      <button onclick="openModal('create_material_modal_frame', 'createMaterial')">Создать новый</button>
    </div>
    {% comment %} create_material_modal_frame {% endcomment %}
  </div>
</div>
