<div id="outer" class="outer">
  <div class="page-menu">
    {% comment %} <input id="companies-list" type="text" name="search" value="{{search}}" placeholder="Поиск.." /> {% endcomment %}
    <label>{{model_version}}</label>
  </div>
  <div id="excel-upload-block">
    {% comment %} <div>
      <input type="file" id="vor-file-input" accept=".xlsx,.xls,.xlsm" multiple>
      <button type="button" id="upload-excel-btn" onclick="uploadVor()">UPLOAD</button>
    </div> {% endcomment %}
    <div>
      <select name="senderSectionSelect" id="senderSectionSelect">
        <option value="-1">---</option>
        {% for section in sections %}
          <option value="{{section.id}}">{{section.name}}</option>
        {% endfor %}
      </select>
      <input type="text" id="work-name-input">
      <button type="button" id="get-work-category" onclick="executeAi('work-name-input', 'sender-main-frame')">Categorize</button>

    </div>
    <div id="sender-main-frame" style="display:flex;flex-direction:column;gap:5px;">
      
    </div>
    <label id="category"></label>
  </div>
</div>
