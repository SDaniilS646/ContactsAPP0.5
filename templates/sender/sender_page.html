<div id="outer" class="outer">
  <div class="page-menu">
    {% comment %} <input id="companies-list" type="text" name="search" value="{{search}}" placeholder="Поиск.." /> {% endcomment %}
    
  </div>
  <div id="excel-upload-block">
    <div>
      <input type="file" id="excel-file-input" accept=".xlsx,.xls,.xlsm" multiple>
      <button type="button" id="upload-excel-btn" onclick="checkFileLoaded()">UPLOAD</button>
    </div>
    <div>
      <input type="text" id="work-name-input">
      <button type="button" id="get-work-category" onclick="getCategory()">Categorize</button>
    </div>
    <label id="category"></label>
  </div>
</div>
