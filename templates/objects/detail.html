<div id="objects-details-modal-frame" class="modal">
  <div class="modal-content details">
    <div class="modal-head">
      <div class="menu-btns">
        <button onclick="openModal('edit_object_modal_frame', 'editObject', {{object.id}})" class="spec-btn">edit</button>
        <button onclick="post_delItem('objects', {{object.id}})" class="spec-btn">del</button>
        {% include 'components/modal_remove_btn.html' with frame_id='objects-details-modal-frame' %}
      </div>
      <div class="modal-header">
        <h1>{{object.name}}</h1>
      </div>
    </div>
    <div class="modal-main">
      <div class="details-info">
        <span>Адрес:</span><span>{{object.address | default:'—'}}</span>
      </div>

      <div class="addition-info">
        <div class="menu-btns">
          
        </div>
        <div class="modal-header">
          <h3>Бренд-лист</h3>
        </div>
        <div class="list">

        </div>
      </div>
    </div>
  </div>
</div>
